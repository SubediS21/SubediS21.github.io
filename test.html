<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>Chooser</title>
    <link href="test.css" rel="stylesheet">
</head>

<body>
    <a style="font-size: medium;" href="index.html">Back to main Page</a>
    <hr style="height:10px; background-color:#9879b0">
    <h1>Chooser</h1>
    <select style="padding: 5px; border-radius: 5px;" id="controls" aria-placeholder="Choose Level">
        <option value="">Choose Level</option>
        <option value="3">3</option>
        <option value="4">4</option>
        <option value="5">5</option>
        <option value="6">6</option>
        <option value="7">7</option>
        <option value="8">8</option>
        <option value="9">9</option>
        <option value="10">10</option>
        <option value="11">11</option>
        <option value="12">12</option>
    </select>
    <button style="padding: 5px; border-radius: 5px;" onclick="test()">Submit</button>
    <br>
    <br>
    <div id="card-container">
    </div>
    <div id="symbol-container"></div>
    <div id="status">Choose level to render cards.</div>
    <p id="test"></p>

    <script src="card_gen.js"></script>
    <script type="module" src="test.js"></script>
</body>

</html>
